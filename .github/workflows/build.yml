name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flet[all]
      - run: yes | flet build apk --verbose
      - run: find. -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: azani-wifi-apk
          path: "**/*.apk"
