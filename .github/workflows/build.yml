name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --module-name main --requirements jnius,pyjnius
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azani-wifi-v1.7
          path: build/apk/*.apk
