name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Flet
      run: pip install flet
    - name: Build APK
      run: flet build apk --yes --android-permission ACCESS_WIFI_STATE --android-permission CHANGE_WIFI_STATE --android-permission ACCESS_FINE_LOCATION --android-permission ACCESS_COARSE_LOCATION
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: azani-wifi-apk
        path: build/apk/*.apk
