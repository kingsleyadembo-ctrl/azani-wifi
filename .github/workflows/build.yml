name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Flet
      run: pip install flet pyjnius
    - name: Build APK
      run: flet build apk --yes
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: azani-wifi-apk-v1.2
        path: build/apk/*.apk
